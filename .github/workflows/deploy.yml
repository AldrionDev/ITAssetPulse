name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Queue overlapping deploys instead of racing them. Never cancel a run in
# progress: it could be halfway through a rollout.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    # Nothing reaches ECR or the cluster unless lint, tests and both builds pass.
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:latest \
            ./backend

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:latest

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.FRONTEND_ECR_REPOSITORY }}:latest \
            ./frontend

      - name: Push frontend Docker image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.FRONTEND_ECR_REPOSITORY }}:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name itassetpulse-demo-eks

      - name: Restart backend deployment
        run: |
          kubectl rollout restart deployment/itassetpulse-backend -n itassetpulse

      - name: Restart frontend deployment
        run: |
          kubectl rollout restart deployment/itassetpulse-frontend -n itassetpulse

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/itassetpulse-backend -n itassetpulse --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/itassetpulse-frontend -n itassetpulse --timeout=180s

      - name: Show pods
        run: |
          kubectl get pods -n itassetpulse
